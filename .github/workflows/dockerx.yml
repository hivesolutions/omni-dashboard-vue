name: DockerX Workflow
on:
  push:
    tags:
      - "*"
    branches-ignore:
      - none
  workflow_dispatch:

concurrency:
  group: dockerx-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast (${{ matrix.config.dockerfile }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { dockerfile: "Dockerfile", tag_suffix: "-amd64" }
    uses: ./.github/workflows/dockerx-build.yml
    with:
      dockerfile: ${{ matrix.config.dockerfile }}
      platforms: "linux/amd64"
      tag_suffix: ${{ matrix.config.tag_suffix }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  full:
    name: Full (${{ matrix.config.dockerfile }})
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        config:
          - { dockerfile: "Dockerfile", platforms: "linux/amd64,linux/arm/v7,linux/arm64/v8" }
    uses: ./.github/workflows/dockerx-build.yml
    with:
      dockerfile: ${{ matrix.config.dockerfile }}
      platforms: ${{ matrix.config.platforms }}
      tag_suffix: ""
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  trigger-deploy-local-omni-dashboard:
    name: Trigger omni-dashboard deployment (infra-local)
    timeout-minutes: 10
    needs: fast
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: [self-hosted, ubuntu, latest]

    steps:
      - name: Trigger deployment
        uses: hivesolutions/deploy-action@v1
        with:
          repository: hivesolutions/infra-local
          service: omni-dashboard
          group: apps
          tag: latest-amd64
          token: ${{ secrets.INFRA_DEPLOY_PAT }}
